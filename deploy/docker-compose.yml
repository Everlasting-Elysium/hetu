# hetu deployment.
#
# The `hetu` core is self-contained (pure-Go SQLite, no CGO). The rclone / ai
# services are Phase 1 integration points, opt-in via compose profiles:
# `docker compose --profile ai up`, etc.
#
# Video/PDF/office thumbnails need ffmpeg (+ffprobe), a PDF tool (pdftoppm+pdfinfo
# or mutool), and libreoffice (ppt/pptx -> PDF) on PATH inside the hetu image;
# see deploy/Dockerfile. Absent those tools the assets are still indexed, just
# without thumbnails or per-page previews.
name: hetu

services:
  hetu:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hetu:dev
    ports:
      - "8080:8080"
    environment:
      HETU_ADDR: ":8080"
      HETU_PLUGINS: "dam,nas"
      HETU_DATA_DIR: "/data"
      HETU_DB_PATH: "/data/hetu.db"
      HETU_LIBRARY_DIR: "/library"
      # Uncomment to enable rclone storage (requires --profile storage):
      # HETU_RCLONE_ADDR: "rclone:5572"
      # HETU_RCLONE_REMOTE: "remote:"
      # 3D model conversion backend (issue #78). Empty = auto-detect (assimp on
      # PATH, else none). 3D previews are rendered client-side, so hetu ships no
      # Blender sidecar; put assimp on PATH in the image to enable OBJ/FBX/STL →
      # GLB conversion. Explicit value: "assimp".
      # HETU_MODEL_CONVERTER: ""
    volumes:
      - hetu-data:/data
      - ./library:/library
    restart: unless-stopped

  # Phase 1: local AI sidecar (CLIP embeddings, tagger, captioner, OCR).
  ai:
    build:
      context: ../ai
    image: hetu-ai:dev
    profiles: ["ai"]
    ports:
      - "8091:8091"
    restart: unless-stopped

  # Expose 70+ cloud-drive backends via rclone RC daemon (--rc-serve).
  # 1. Put a remote in ./deploy/rclone/rclone.conf
  # 2. Start with: docker compose --profile storage up
  # 3. Set HETU_RCLONE_ADDR=rclone:5572 on the hetu service
  # RC JSON API (operations/list, operations/stat) + HTTP file server on same port.
  rclone:
    image: rclone/rclone:latest
    profiles: ["storage"]
    command: ["rcd", "--rc-addr", ":5572", "--rc-serve", "--rc-no-auth"]
    volumes:
      - ./deploy/rclone:/config/rclone
    ports:
      - "5572:5572"
    restart: unless-stopped

volumes:
  hetu-data:
